[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profit-hunter"
version = "0.1.0"
description = "Conservative, AI-assisted resale sourcing tool (local application)."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "tzdata",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["profit_hunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
